<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070B" />
    <meta name="description" content="Katman — 3D baskı fiyat ve işletme paneli" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Katman" />
    <title>Katman</title>
    <script>
      // Tema, ilk boyamadan önce uygulanır (yanıp sönme olmasın)
      ;(function () {
        try {
          var raw = localStorage.getItem('katman-ui')
          var pref = raw ? JSON.parse(raw).state.theme : 'dark'
          var dark = pref === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : pref !== 'light'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
